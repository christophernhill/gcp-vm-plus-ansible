# Settings for the Rocky Linux 10 VM on GCP.
# Edit these values, then run: python3 generator/generate.py

gcp:
  project_id: orcd-dr
  region: us-central1
  zone: us-central1-a

network:
  name: rocky10-net
  # CIDRs allowed to reach SSH. 0.0.0.0/0 = open internet.
  # GCP VPCs deny all other ingress by default, so SSH is the only open port.
  ssh_source_ranges:
    - 0.0.0.0/0

vm:
  name: rocky10-vm
  # n2-standard-16 = 16 vCPU / 64 GB RAM. The generator refuses machine
  # types it can determine to have less than min_memory_gb.
  machine_type: n2-standard-16
  min_memory_gb: 64
  boot_disk_gb: 250
  boot_disk_type: pd-balanced       # pd-standard | pd-balanced | pd-ssd
  # Total external IPv4 addresses on the VM, 1-8. The first is the NIC's
  # ephemeral IP; each extra one is a reserved static IP routed to the
  # same NIC via GCP protocol forwarding (the firewall still applies, so
  # SSH remains the only open port on every address).
  external_ip_count: 4
  image:
    project: rocky-linux-cloud
    family: rocky-linux-10
  ssh_user: rocky
  # Public keys injected into the VM's metadata for ssh_user. All three
  # sources below are merged (duplicates dropped); at least one key must
  # come from somewhere.
  # A file of initial keys, one per line (authorized_keys format;
  # blank lines and # comments ignored). Relative to the repo root:
  ssh_public_keys_file: config/rocky_authorized_keys
  # A single-key file...
  ssh_public_key_file: ~/.ssh/gce_cf_key.pub
  # ...or a key pasted inline:
  # ssh_public_key: "ssh-ed25519 AAAA... user@host"
