# Settings for a VM on GCP.
#
# This is the committed example. The generator reads the local copy at
# config/vm.yaml, which is gitignored:
#     cp config/examples/vm.yaml config/vm.yaml
# Edit the copy (at minimum gcp.project_id and an SSH key source), then
# run: python3 generator/generate.py

# provider: gcp      # the default; AWS configs set "provider: aws"

gcp:
  project_id: my-gcp-project
  region: us-central1
  zone: us-central1-a

network:
  name: rocky10-net
  # CIDRs allowed to reach SSH. 0.0.0.0/0 = open internet.
  # GCP VPCs deny all other ingress by default, so SSH and the
  # open_ports list below are the only ways in.
  ssh_source_ranges:
    - 0.0.0.0/0
  # Extra ports to open to the public internet (0.0.0.0/0) on top of
  # SSH; applies to every external IP and NIC. Each entry is a port, a
  # "low-high" range, or either with a tcp:/udp: prefix (plain entries
  # are TCP), e.g. [80, 443, "8000-8100", "udp:51820"]. Empty = SSH only.
  open_ports: []

vm:
  name: rocky10-vm
  # n2-standard-16 = 16 vCPU / 64 GB RAM. The generator refuses machine
  # types it can determine to have less than min_memory_gb.
  machine_type: n2-standard-16
  min_memory_gb: 64
  boot_disk_gb: 250
  boot_disk_type: pd-balanced       # pd-standard | pd-balanced | pd-ssd
  # Total external IPv4 addresses on the VM, 1-8. The first is the NIC's
  # ephemeral IP; each extra one is a reserved static IP routed to the
  # same NIC via GCP protocol forwarding (the firewall still applies —
  # the same rules cover every address). These do NOT show
  # up as interfaces in `ip a` — for that, see nic_count below.
  external_ip_count: 1
  # Number of network interfaces (vNICs), 1-8, each visible in `ip a`
  # with its own subnet (10.10.<i>.0/24) and its own external IP.
  # WARNING: changing this replaces the VM (NICs are fixed at creation),
  # and with >1 the VPC switches from auto to custom subnets, which
  # replaces the network too. Meant for new VMs, not a deployed one.
  nic_count: 1
  # Base OS. One of: rocky-10, rocky-9, almalinux-10, almalinux-9,
  # centos-stream-10, centos-stream-9, fedora-44, fedora-43,
  # ubuntu-24.04, ubuntu-22.04, debian-13, debian-12. Sets the boot
  # image and the default ssh_user. For any other GCP public image,
  # delete vm.os and set vm.image instead (the two are mutually
  # exclusive):
  os: rocky-10
  # image:
  #   project: rocky-linux-cloud
  #   family: rocky-linux-10
  # Login account created via the instance's ssh-keys metadata. The
  # vm.os preset picks the distro's conventional name (rocky, ubuntu,
  # debian, almalinux); uncomment to override, required with vm.image:
  # ssh_user: rocky
  # Public keys injected into the VM's metadata for ssh_user. All three
  # sources below are merged (duplicates dropped); at least one key must
  # come from somewhere.
  # A file of initial keys, one per line (authorized_keys format;
  # blank lines and # comments ignored). Relative to the repo root:
  ssh_public_keys_file: config/base_authorized_keys
  # A single-key file...
  # ssh_public_key_file: ~/.ssh/id_ed25519.pub
  # ...or a key pasted inline:
  # ssh_public_key: "ssh-ed25519 AAAA... user@host"
